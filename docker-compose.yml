services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: edu
      POSTGRES_DB: edu
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu"]
      interval: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://edu:edu@db:5432/edu
    ports: ["8000:8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"   # accès à un Ollama installé sur l'hôte (Linux/WSL)
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      API_TARGET: http://backend:8000
    ports: ["5173:5173"]
    depends_on: [backend]

  # Optionnel : Ollama dans Docker -> `docker compose --profile ollama up`
  # puis `docker compose exec ollama ollama pull qwen3:8b` et OLLAMA_URL=http://ollama:11434
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    # GPU NVIDIA : décommenter
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes:
  pgdata:
  ollama:
